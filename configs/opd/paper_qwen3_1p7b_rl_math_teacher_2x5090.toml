# Two-RTX-5090 execution of the paper's Qwen3-1.7B (non-thinking) student and
# Qwen3-4B-Non-Thinking-RL-Math teacher experiment. Algorithmic defaults follow
# Appendix A.2 / Table 2. The two-GPU topology preserves the paper config's
# global batch and optimizer semantics while fitting two 32 GiB consumer GPUs.
schema_version = 1

[experiment]
name = "paper_qwen3_1p7b_qwen3_4b_non_thinking_rl_math_topk16_2x5090"
project_name = "Rethinking-OPD"
output_dir = "checkpoint"
log_dir = "logs"
validation_dir = "validation_log"
diagnostics_dir = "diag_out"

[models]
student = "model/Qwen3-1.7B"
teacher = "model/Qwen3-4B-Non-Thinking-RL-Math"
enable_thinking = false
# Keep FP32 actor parameters so AdamW state is FP32 in this verl FSDP path.
model_dtype = "fp32"
teacher_dtype = "bf16"
gradient_checkpointing = true
activation_offload = true

[data]
name = "DAPO-Math-17k-Processed"
train_file = "datasets/dapo-math-17k-processed.parquet"
validation_files = [
  "datasets/test_data/AIME24/test.parquet",
  "datasets/test_data/AIME25/test.parquet",
]
shuffle = false
seed = 42
max_prompt_length = 1024
max_response_length = 7168
filter_overlong_prompts = true
truncation = "error"
preflight = "paper_dapo"

[rollout]
engine = "vllm"
responses_per_prompt = 4
do_sample = true
temperature = 1.0
teacher_temperature = 1.0
sampling_top_k = -1
top_p = 1.0
repetition_penalty = 1.0
ignore_eos = false

[objective]
adv_estimator = "token_reward_direct"
method = "top_k"
top_k = 16
diagnostic_top_k = 0
top_k_strategy = "only_stu"
reward_weight_mode = "student_p"
advantage_clip = 0.0
loss_aggregation = "token-mean"
entropy_coefficient = 0.0
use_kl_loss = false
kl_loss_coefficient = 0.0
kl_loss_type = "low_var_kl"
use_kl_in_reward = false
kl_reward_coefficient = 0.0
grpo_outcome_weight = 1.0

[optimizer]
learning_rate = 1e-6
scheduler = "constant"
warmup_ratio = 0.0
weight_decay = 0.01
betas = [0.9, 0.999]
epsilon = 1e-8
gradient_clip = 1.0

[training]
# The paper artifact has 17,917 rows. Its Qwen3 non-thinking template leaves
# 17,909 prompts within 1,024 tokens; drop_last=True gives 279 steps/epoch.
steps = 279
epochs = 1
train_batch_size = 64
mini_batch_size = 64
ppo_epochs = 1
shuffle_minibatches = false
ppo_micro_batch_size_per_gpu = 1
reward_micro_batch_size_per_gpu = 1

[runtime]
gpus_per_node = 2
nodes = 1
# Each 1.7B rollout replica fits one card. DP avoids TP collectives over PCIe;
# RTX 5090 does not provide NVLink.
tensor_parallel_size = 1
sequence_parallel_size = 1
# The loader raises these to max_prompt + max_response + 1 (=8193), allowing
# one worst-case sequence per dynamic microbatch and bounding activation peaks.
actor_max_tokens_per_gpu = 8192
teacher_max_tokens_per_gpu = 8192
gpu_memory_utilization = 0.20
actor_param_offload = false
optimizer_offload = true
teacher_param_offload = true
forward_prefetch = false

[checkpoints]
save_steps = [20, 40, 50, 60, 80, 100, 120, 140, 160, 180, 200, 220, 240, 260, 279]
optimizer_save_steps = [50]

[validation]
# Verl-side validation remains disabled because this fork under-reports accuracy.
# These values record the paper's external evaluation sampling configuration.
before_training = false
frequency = -1
max_response_length = 31744
responses_per_prompt = 16
temperature = 0.7
top_k = -1
top_p = 0.95
do_sample = true
prompt_suffix = ' Please reason step by step, and put your final answer within \boxed{}.'
grader = "verl_rule"
seed = 0
gpu_memory_utilization = 0.9
model_dtype = "bfloat16"

[reward]
enable_format_reward = false
custom_function_path = "verl/verl/utils/reward_score/ttrl_math/__init__.py"
custom_function_name = "reward_func"

[tracking]
loggers = ["console", "swanlab"]
swanlab_mode = "offline"
is_plot = true
plot_steps = [1]
plot_frequency = 10
opd_text_diagnostics = true
dump_rollouts = false
rollout_data_steps = []

[hydra]
extra_overrides = []
