# Diagnostic 50-step prefix of the paper's Qwen3-1.7B (non-thinking) student
# and Qwen3-4B-Non-Thinking-RL-Math teacher experiment. Training settings are
# identical to paper_qwen3_1p7b_rl_math_teacher_a100.toml except for the explicit
# stopping/checkpoint/diagnostic schedules requested for this run.
schema_version = 1

[experiment]
name = "paper_qwen3_1p7b_qwen3_4b_non_thinking_rl_math_topk16_a100_step50"
project_name = "Rethinking-OPD"
output_dir = "checkpoint"
log_dir = "logs"
validation_dir = "validation_log"
diagnostics_dir = "diag_out"

[models]
student = "model/Qwen3-1.7B"
teacher = "model/Qwen3-4B-Non-Thinking-RL-Math"
enable_thinking = false
model_dtype = "fp32"
teacher_dtype = "fp32"
gradient_checkpointing = true
activation_offload = true

[data]
name = "DAPO-Math-17k-Processed"
train_file = "datasets/dapo-math-17k-processed.parquet"
validation_files = [
  "datasets/test_data/AIME24/test.parquet",
  "datasets/test_data/AIME25/test.parquet",
  "datasets/test_data/AMC23/test.parquet",
]
shuffle = false
seed = 42
max_prompt_length = 1024
max_response_length = 7168
filter_overlong_prompts = true
truncation = "error"
preflight = "paper_dapo"

[rollout]
engine = "vllm"
responses_per_prompt = 4
do_sample = true
temperature = 1.0
teacher_temperature = 1.0
sampling_top_k = -1
top_p = 1.0
repetition_penalty = 1.0
ignore_eos = false

[objective]
adv_estimator = "token_reward_direct"
method = "top_k"
top_k = 16
diagnostic_top_k = 0
top_k_strategy = "only_stu"
reward_weight_mode = "student_p"
# The author's paper experiment does not clip the direct advantages.
advantage_clip = 0.0
loss_aggregation = "token-mean"
entropy_coefficient = 0.0
use_kl_loss = false
kl_loss_coefficient = 0.0
kl_loss_type = "low_var_kl"
use_kl_in_reward = false
kl_reward_coefficient = 0.0
grpo_outcome_weight = 1.0

[optimizer]
learning_rate = 1e-6
scheduler = "constant"
warmup_ratio = 0.0
weight_decay = 0.01
betas = [0.9, 0.999]
epsilon = 1e-8
gradient_clip = 1.0

[training]
steps = 50
epochs = 1
train_batch_size = 64
mini_batch_size = 64
ppo_epochs = 1
shuffle_minibatches = false
ppo_micro_batch_size_per_gpu = 1
reward_micro_batch_size_per_gpu = 1

[runtime]
gpus_per_node = 1
nodes = 1
tensor_parallel_size = 1
sequence_parallel_size = 1
actor_max_tokens_per_gpu = 16384
teacher_max_tokens_per_gpu = 16384
gpu_memory_utilization = 0.25
actor_param_offload = false
optimizer_offload = false
teacher_param_offload = false
forward_prefetch = true

[checkpoints]
# Steps 1-40 are model+extra only. Step 50 also has optimizer state and is the
# only resumable checkpoint, avoiding optimizer-state duplication.
save_steps = [1, 2, 3, 4, 5, 10, 15, 20, 30, 40, 50]
optimizer_save_steps = [50]

[validation]
# Exact paper evaluation is run externally after training.
before_training = false
frequency = -1
max_response_length = 31744
responses_per_prompt = 16
temperature = 0.7
top_k = -1
top_p = 0.95
do_sample = true
prompt_suffix = ' Please reason step by step, and put your final answer within \boxed{}.'
grader = "verl_rule"
seed = 0
gpu_memory_utilization = 0.9
model_dtype = "bfloat16"

[reward]
enable_format_reward = false
custom_function_path = "verl/verl/utils/reward_score/ttrl_math/__init__.py"
custom_function_name = "reward_func"

[tracking]
# metrics.jsonl records every scalar step independently of SwanLab. SwanLab
# retains plots; full decoded rollout records are dumped at the diagnostic
# checkpoints, with every one of the first five steps included.
loggers = ["console", "file", "swanlab"]
swanlab_mode = "offline"
is_plot = true
plot_steps = [1, 2, 3, 4, 5, 10, 15, 20, 30, 40, 50]
plot_frequency = 0
opd_text_diagnostics = true
dump_rollouts = true
rollout_data_steps = [1, 2, 3, 4, 5, 10, 15, 20, 30, 40, 50]

[hydra]
extra_overrides = []
